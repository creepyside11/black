<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="color-scheme" content="dark">
<title>RakCRMP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- ЭКРАН ВХОДА -->
<div id="gate" class="gate">
  <div class="gate-card glass">
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 22V10l10 8 10-8v12" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>RakCRMP</h1>
    <p class="gate-sub" id="gate-sub">Проверяю вход через Telegram…</p>

    <form id="login-form" class="gate-form" hidden>
      <label class="fld">
        <span>Логин</span>
        <input id="in-login" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="off" required>
      </label>
      <label class="fld">
        <span>Пароль</span>
        <input id="in-pass" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-solid" type="submit" id="in-submit">Войти</button>
    </form>

    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="app" hidden>
  <header class="bar glass">
    <div class="bar-l">
      <b>RakCRMP</b>
      <span class="live" id="live"><i></i><em>связь</em></span>
    </div>
    <div class="bar-r">
      <span class="who" id="who"></span>
      <button class="icon" id="btn-refresh" title="Обновить">↻</button>
    </div>
  </header>

  <main id="views">

    <!-- АККАУНТЫ -->
    <section class="view" data-view="accounts">
      <div class="stat-row" id="stat-row"></div>

      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Ник или сервер" autocomplete="off">
        <button class="chip-btn" id="btn-select" title="Выделить">Выбрать</button>
      </div>
      <div class="chips" id="filters">
        <button class="chip on" data-filter="all">Все</button>
        <button class="chip" data-filter="online">В игре</button>
        <button class="chip" data-filter="offline">Офлайн</button>
        <button class="chip" data-filter="banned">Бан</button>
      </div>

      <div id="bots" class="list"></div>
      <div class="empty" id="bots-empty" hidden>Пусто. Создай аккаунт на вкладке «Создать».</div>
    </section>

    <!-- ПРОКСИ -->
    <section class="view" data-view="proxy" hidden>
      <div class="stat-row" id="vpn-stats"></div>

      <div class="toolbar">
        <input class="search" id="vpn-q" type="search" placeholder="Имя, адрес, протокол" autocomplete="off">
        <button class="chip-btn" id="vpn-refresh">Проверить</button>
      </div>
      <div class="chips">
        <button class="chip on" id="vpn-usable">Только рабочие</button>
        <button class="chip" id="vpn-sub">Подписка</button>
      </div>

      <div id="nodes" class="list"></div>
      <div class="pager" id="vpn-pager"></div>
    </section>

    <!-- СОЗДАТЬ -->
    <section class="view" data-view="create" hidden>
      <form class="glass card form" id="create-form">
        <h2>Новый аккаунт</h2>
        <label class="fld"><span>Сервер</span>
          <select id="c-server" required></select>
        </label>
        <label class="fld"><span>Ник — пусто, сгенерирую</span>
          <input id="c-nick" type="text" maxlength="20" spellcheck="false" autocapitalize="off">
        </label>
        <div class="two">
          <label class="fld"><span>Сколько</span>
            <input id="c-count" type="number" min="1" max="50" value="1">
          </label>
          <label class="fld"><span>Задача</span>
            <select id="c-task"></select>
          </label>
        </div>
        <label class="fld"><span>Пароль — пусто, базовый</span>
          <input id="c-pass" type="text" spellcheck="false" autocapitalize="off">
        </label>
        <label class="fld"><span>Прокси</span>
          <select id="c-proxy"></select>
        </label>
        <button class="btn btn-solid" type="submit" id="c-go">Создать</button>
      </form>
    </section>

    <!-- ЕЩЁ -->
    <section class="view" data-view="more" hidden>
      <form class="glass card form" id="settings-form">
        <h2>Настройки</h2>
        <label class="fld"><span>Базовый пароль новых</span>
          <input id="s-pass" type="text" spellcheck="false" autocapitalize="off">
        </label>
        <label class="fld"><span>Задача по умолчанию</span>
          <select id="s-task"></select>
        </label>
        <button class="btn btn-solid" type="submit">Сохранить</button>
      </form>

      <div class="glass card">
        <h2>Массовые действия</h2>
        <p class="hint">Работает по выделенным аккаунтам на вкладке «Аккаунты».</p>
        <div class="btn-row">
          <button class="btn" data-bulk="start_many">Запустить</button>
          <button class="btn" data-bulk="stop_many">Остановить</button>
          <button class="btn" data-bulk="stats">Статистика</button>
          <button class="btn" data-bulk="real_world">В мир</button>
        </div>
        <div class="btn-row">
          <input class="search" id="goal-level" type="number" min="0" max="200" placeholder="цель, 0 — снять">
          <button class="btn" data-bulk="goal_many">Цель</button>
        </div>
        <div class="btn-row">
          <button class="btn btn-danger" data-bulk="delete_many">Удалить выделенных</button>
        </div>
      </div>

      <div class="glass card">
        <h2>Аккаунт</h2>
        <div class="kv"><span>Логин</span><b id="m-login">—</b></div>
        <div class="kv"><span>Telegram</span><b id="m-tg">—</b></div>
        <div class="kv"><span>Серверов</span><b id="m-servers">—</b></div>
        <button class="btn btn-danger btn-block" id="btn-logout">Выйти</button>
      </div>
    </section>

  </main>

  <!-- ПАНЕЛЬ ВЫДЕЛЕНИЯ -->
  <div class="bulkbar glass" id="bulkbar" hidden>
    <span id="bulk-count">0</span>
    <div class="btn-row tight">
      <button class="btn btn-sm" data-bulk="start_many">▶</button>
      <button class="btn btn-sm" data-bulk="stop_many">■</button>
      <button class="btn btn-sm" data-bulk="real_world">◎</button>
      <button class="btn btn-sm" data-bulk="stats">↻</button>
      <button class="btn btn-sm btn-danger" data-bulk="delete_many">✕</button>
    </div>
    <button class="icon" id="bulk-x">✕</button>
  </div>

  <!-- НИЖНИЙ ДОК -->
  <nav class="dock glass" id="dock">
    <button class="dock-btn on" data-view="accounts">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
      <span>Боты</span>
    </button>
    <button class="dock-btn" data-view="proxy">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13 0 16M12 4c-2.5 2.5-2.5 13 0 16" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span>Прокси</span>
    </button>
    <button class="dock-btn" data-view="create">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>Создать</span>
    </button>
    <button class="dock-btn" data-view="more">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18" cy="12" r="1.8" fill="currentColor"/></svg>
      <span>Ещё</span>
    </button>
  </nav>
</div>

<!-- МОДАЛКА -->
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet glass" id="sheet"></div>
</div>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
